<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habibi API — Dokumentasi Interaktif</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #0d0d1a; color: #e0e0e0; padding: 20px; }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { color: #a855f7; font-size: 2em; margin-bottom: 5px; }
  h1 a { color: #a855f7; text-decoration: none; }
  .subtitle { color: #888; margin-bottom: 20px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; position: sticky; top: 0; background: #0d0d1a; padding: 10px 0; z-index: 10; }
  .toolbar input { flex: 1; min-width: 200px; background: #1a1a2e; border: 1px solid #a855f744; color: #fff; padding: 10px 15px; border-radius: 8px; }
  .toolbar .keybox { flex: 1; min-width: 250px; }
  .cat-title { color: #a855f7; margin: 25px 0 15px; font-size: 1.4em; }
  .card { background: #1a1a2e; border: 1px solid #a855f722; border-radius: 12px; padding: 18px; margin-bottom: 12px; }
  .card h3 { color: #e0e0e0; margin-bottom: 8px; font-size: 1em; word-break: break-all; }
  .card p.desc { color: #888; font-size: 0.9em; margin-bottom: 10px; }
  code { background: #0d0d1a; padding: 3px 8px; border-radius: 6px; color: #7dd3fc; font-size: 0.85em; }
  .method { display: inline-block; background: #22c55e; color: #000; font-weight: bold; padding: 2px 10px; border-radius: 6px; font-size: 0.75em; margin-right: 8px; }
  .method.post { background: #f59e0b; }
  .btn { background: #a855f7; color: #fff; padding: 8px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 0.9em; }
  .btn:hover { opacity: 0.85; }
  .btn-sm { padding: 5px 14px; font-size: 0.8em; }
  .test-panel { margin-top: 12px; padding-top: 12px; border-top: 1px solid #333; display: none; }
  .test-panel.open { display: block; }
  .test-panel input { background: #0d0d1a; border: 1px solid #a855f744; color: #fff; padding: 8px 12px; border-radius: 6px; margin: 0 8px 8px 0; width: 220px; font-size: 0.9em; }
  .test-panel label { font-size: 0.8em; color: #888; display: block; margin-bottom: 2px; }
  .param-row { display: inline-block; margin-right: 5px; }
  .response { background: #0d0d1a; border-radius: 8px; padding: 12px; margin-top: 10px; max-height: 300px; overflow: auto; font-family: monospace; font-size: 0.8em; white-space: pre-wrap; word-break: break-all; display: none; }
  .response.show { display: block; }
  .response.ok { border-left: 3px solid #22c55e; }
  .response.err { border-left: 3px solid #ef4444; }
  .hot { border-color: #f59e0b !important; }
  .key-card { background: #1a1a2e; border: 1px solid #a855f744; border-radius: 12px; padding: 18px; margin-bottom: 15px; }
  .key-card input { background: #0d0d1a; border: 1px solid #a855f744; color: #fff; padding: 10px 15px; border-radius: 8px; width: 200px; margin-right: 10px; }
  #keyResult { margin-top: 12px; word-break: break-all; }
  .copy-btn { background: #333; color: #fff; border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75em; margin-left: 8px; }
  .hidden { display: none !important; }
  .lang-btn { background: #1a1a2e; border: 1px solid #a855f744; color: #a855f7; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
  .lang-btn.active { background: #a855f7; color: #fff; }
  /* Mobile responsive */
  @media (max-width: 600px) {
    body { padding: 12px; }
    h1 { font-size: 1.5em; }
    .card { padding: 14px; }
    .card h3 { font-size: 0.85em; }
    .test-panel input { width: 100%; margin-bottom: 8px; }
    .param-row { display: block; }
    .toolbar { position: static; }
    .toolbar input { min-width: 100%; }
  }
</style>
</head>

let lastCat = '';
let html = '';
ENDPOINTS.forEach((ep, i) => {
  if (ep.cat !== lastCat) { html += `<div class="cat-title">${ep.cat}</div>`; lastCat = ep.cat; }
  const mCls = ep.method === 'POST' ? 'method post' : 'method';
  html += `<div class="card${ep.hot ? ' hot' : ''}" data-search="${(ep.path + ' ' + ep.desc).toLowerCase()}">
    <h3><span class="${mCls}">${ep.method}</span><code>${ep.path}</code>
      <button class="copy-btn" onclick="copyUrl(${i})">📋</button></h3>
    <p class="desc" data-id="${ep.desc}" data-en="${ep.en || ep.desc}">${ep.desc}</p>
    <button class="btn btn-sm" onclick="toggleTest(${i})">🧪 Test</button>
    <div class="test-panel" id="tp-${i}">
      ${ep.params.map(p => p.path ? '' : `<span class="param-row"><label>${p.name}</label><input id="p-${i}-${p.name}" placeholder="${p.ph || ''}"></span>`).join('')}
      ${ep.params.filter(p => p.path).map(p => `<span class="param-row"><label>${p.name} (di URL)</label><input id="p-${i}-${p.name}" placeholder="${p.ph || ''}"></span>`).join('')}

      <div class="response" id="resp-${i}"></div>
    </div>
  </div>`;
});
document.getElementById('endpoints').innerHTML = html;

function toggleTest(i) {
  document.getElementById('tp-' + i).classList.toggle('open');
}

function buildUrl(i) {
  const ep = ENDPOINTS[i];
  let path = ep.path;
  const qs = [];
  ep.params.forEach(p => {
    const v = (document.getElementById(`p-${i}-${p.name}`) || {}).value || '';
    if (p.path) { path = path.replace('{' + p.name + '}', encodeURIComponent(v || p.ph || '')); }
    else if (v) { qs.push(p.name + '=' + encodeURIComponent(v)); }
  });
  // path params yang kosong pakai placeholder
  path = path.replace(/\{(\w+)\}/g, (m, n) => {
    const ep2 = ENDPOINTS[i].params.find(p => p.name === n);
    return encodeURIComponent((ep2 && ep2.ph) || '');
  });
  const key = savedKey || document.getElementById('globalKey').value.trim();
  if (ep.method === 'GET' && !ep.body) {
    if (key) qs.push('apikey=' + encodeURIComponent(key));
    return { url: API + path + (qs.length ? '?' + qs.join('&') : ''), method: 'GET' };
  }
  return { url: API + path, method: ep.method, body: ep.body ? collectBody(i) : null };
}

function collectBody(i) {
  const ep = ENDPOINTS[i];
  const b = {};
  ep.params.forEach(p => {
    const v = (document.getElementById(`p-${i}-${p.name}`) || {}).value;
    if (v) b[p.name] = v;
  });
  const key = savedKey;
  return b;
}

async function runTest(i) {
  const ep = ENDPOINTS[i];
  const respEl = document.getElementById('resp-' + i);
  const { url, method, body } = buildUrl(i);
  respEl.className = 'response show';
  respEl.textContent = '⏳ Loading...';
  try {
    const opts = { method, headers: {} };
    if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    const r = await fetch(url, opts);
    const ct = r.headers.get('content-type') || '';
    if (ep.img || ct.startsWith('image/')) {
      respEl.innerHTML = '';
      const img = document.createElement('img');
      img.src = url; img.style.maxWidth = '100%'; img.style.borderRadius = '8px';
      respEl.appendChild(img);
    } else if (ct.includes('audio') || url.includes('/tts')) {
      respEl.innerHTML = `<audio controls src="${url}" style="width:100%"></audio>`;
    } else {
      const t = await r.text();
      try { respEl.textContent = JSON.stringify(JSON.parse(t), null, 2); }
      catch { respEl.textContent = t.substring(0, 2000); }
    }
    respEl.classList.add(r.ok ? 'ok' : 'err');
  } catch (e) {
    respEl.textContent = '❌ Error: ' + e.message;
    respEl.classList.add('err');
  }
}

function copyUrl(i) {
  const { url } = buildUrl(i);
  navigator.clipboard.writeText(location.origin + url).then(() => alert('URL dicopy!'));
}

function filterEndpoints() {
  const q = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.card[data-search]').forEach(c => {
    c.classList.toggle('hidden', q && !c.dataset.search.includes(q));
  });
  document.querySelectorAll('.cat-title').forEach(t => {
    let next = t.nextElementSibling, any = false;
    while (next && !next.classList.contains('cat-title')) {
      if (!next.classList.contains('hidden')) { any = true; break; }
      next = next.nextElementSibling;
    }
    t.classList.toggle('hidden', q && !any);
  });
}

async function genKey() {
  const name = document.getElementById('nameInput').value || 'user';
  const r = await fetch(API + '/api/key/generate', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name})
  });
  const j = await r.json();
  const el = document.getElementById('keyResult');
  if (j.status) {
    el.innerHTML = `<code style="font-size:1.1em">${j.apikey}</code>
      <button class="btn btn-sm" style="margin-left:10px" onclick="useKey('${j.apikey}')">Pakai Key Ini</button>
      <p style="margin-top:8px;color:#888">Tier: ${j.tier} • Kuota: ${j.quota}</p>`;
  } else el.innerHTML = `<p style="color:red">${j.message}</p>`;
}

function useKey(k) {
  document.getElementById('globalKey').value = k;
  saveKey();
  alert('Key tersimpan! Sekarang bisa test semua endpoint.');
}

async function setWebhook(off) {
  const key = savedKey || document.getElementById('globalKey').value.trim();
  if (!key) return alert('Isi API Key dulu di atas!');
  const url = off ? '' : document.getElementById('webhookInput').value.trim();
  const r = await fetch(API + '/api/key/webhook?apikey=' + encodeURIComponent(key), {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ webhook_url: url })
  });
  const j = await r.json();
  document.getElementById('webhookResult').innerHTML =
    j.status ? `<span style="color:#22c55e">✅ ${j.message}</span>` : `<span style="color:#ef4444">❌ ${j.message}</span>`;
}

// Bahasa ID/EN
let lang = localStorage.getItem('habibi_lang') || 'id';
function setLang(l) {
  lang = l;
  localStorage.setItem('habibi_lang', l);
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  applyLang();
}
function applyLang() {
  document.querySelectorAll('[data-id]').forEach(el => {
    el.innerHTML = lang === 'id' ? el.dataset.id : (el.dataset.en || el.dataset.id);
  });
  document.getElementById('search').placeholder = lang === 'id'
    ? '🔍 Cari endpoint... (misal: tiktok, sholat, ml)'
    : '🔍 Search endpoints... (e.g.: tiktok, prayer, ml)';
}
// Terapkan bahasa tersimpan saat load
applyLang();
